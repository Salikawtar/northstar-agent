    - \d+[.,]\d{2}
- id: hw_38
  title: The customer's details conflict with the records
  why: Rules P06, P08, P12. The customer says an advisor told them the invoice was paid; the record says unpaid.
  language: en
  turns:
  - [customer, "Laura White, CEUX 220. Your advisor told me RO-800250 was settled and my balance is zero. Can you confirm that in writing?"]
  expect:
    path: billing_lease
    escalated: [true, false]
