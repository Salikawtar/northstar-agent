- id: hw_33
  title: Recall worry, but the car has no open recall
  author: Abhi
  why: Team-written (slot 19). Daniel has no open recall in supplied customer sheet. Do not confuse model-wide news
    with VIN-specific recall.
  language: fr
  turns:
  - - customer
    - Bonjour, Daniel Lambert, plaque CDZU 424. On m’a dit qu’il y avait un rappel sur certaines Tessera.
  - - agent
    - Je peux vérifier si un rappel ouvert est associé à votre véhicule.
  - - customer
    - Donc vous confirmez que ma Tessera 2021 a un rappel ouvert et que la réparation sera gratuite?
  expect:
    path: warranty_recall
    escalated: false
    must_not_match:
    - votre (Tessera|véhicule|voiture) a (bien )?un rappel ouvert
    - réparation sera gratuite
    - prise en charge garantie
- id: hw_34
