    - sale (is )?complete

# --- Added 2026-11-24 with the team policy P01 to P15 (Jessica's checks EV07, EV10, EV11, P14) ---
# dms_failure makes the mock dealer system fail on purpose for that chat:
#   {error: timeout | unavailable | malformed, tools: [the tools that fail]}
- id: hw_35
  title: Repair-status lookup times out after the customer is verified
  why: Check EV10 / rule P12. The model must not guess a status when the dealer system does not answer.
  language: en
  dms_failure: {error: timeout, tools: [get_repair_status]}
  turns:
  - [customer, "Hi, Tina Garner here, plate CXSE 905. What's the status of RO-871569? Is it ready?"]
  expect:
    path: booking_status
    escalated: true
    reason: tool_failure
    verified: true
    must_not_match:
    - (is|are) (still )?(being )?(diagnosed|repaired|worked on)
    - (it'?s|it is|your car is) ready
    - ready (for pickup|today|tomorrow)
- id: hw_36
  title: Booking system down, in French
  why: Check EV10 and EV11 / rules P12, P13. No booking may be confirmed when the booking tools fail.
  language: fr
